<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HTML-first text route proof</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #dfe3e8; font-family: Arial, "PingFang SC", sans-serif; }
    .pptx-slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f5f1e8; }
    .eyebrow { position: absolute; left: 72px; top: 64px; margin: 0; color: #ff5538; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .title { position: absolute; left: 72px; top: 132px; width: 880px; margin: 0; color: #15191e; font-size: 60px; line-height: 1.08; font-weight: 700; }
    .subtitle { position: absolute; left: 76px; top: 330px; width: 650px; margin: 0; color: #4a5159; font-size: 24px; line-height: 1.45; }
    .accent { position: absolute; left: 1040px; top: 0; width: 240px; height: 720px; background: #ff5538; }
    .accent-small { position: absolute; left: 1110px; top: 290px; width: 72px; height: 140px; border: 12px solid #15191e; background: transparent; }
    .slide-title { position: absolute; left: 72px; top: 58px; width: 1040px; margin: 0; color: #15191e; font-size: 42px; line-height: 1.12; }
    .module { position: absolute; top: 250px; width: 250px; height: 180px; padding: 28px; border: 2px solid #15191e; background: #ffffff; }
    .module h2 { margin: 0 0 18px; color: #15191e; font-size: 27px; }
    .module p { margin: 0; color: #4a5159; font-size: 18px; line-height: 1.35; }
    .module-a { left: 70px; border-top: 12px solid #ff5538; }
    .module-b { left: 515px; border-top: 12px solid #23aab3; }
    .module-c { left: 960px; border-top: 12px solid #c9f04a; }
    .flow-svg { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; }
    .footer { position: absolute; left: 72px; bottom: 54px; margin: 0; color: #69717a; font-size: 16px; }
  </style>
</head>
<body class="pptx-deck" data-deck-title="HTML-first text route proof" data-language="zh-CN">
  <section class="pptx-slide" data-slide-id="cover">
    <div class="accent" data-pptx-kind="shape" data-pptx-id="cover-accent" data-layout-role="decoration"></div>
    <div class="accent-small" data-pptx-kind="shape" data-pptx-id="cover-symbol" data-layout-role="decoration"></div>
    <p class="eyebrow" data-pptx-kind="text" data-pptx-id="cover-eyebrow">TEXT → HTML → EDITABLE PPTX</p>
    <h1 class="title" data-pptx-kind="text" data-pptx-id="cover-title">先把设计做对，<br>再把它编译成 PPT</h1>
    <p class="subtitle" data-pptx-kind="text" data-pptx-id="cover-subtitle">浏览器负责证明构图，确定性编译器负责保留主要元素可编辑。</p>
  </section>

  <section class="pptx-slide" data-slide-id="flow">
    <h1 class="slide-title" data-pptx-kind="text" data-pptx-id="flow-title">默认链路把创意决策与确定性复刻分开</h1>
    <article class="module module-a" data-pptx-kind="shape" data-pptx-id="module-direction">
      <h2 data-pptx-kind="text" data-pptx-id="module-direction-title">Creative Direction</h2>
      <p data-pptx-kind="text" data-pptx-id="module-direction-copy">先定义叙事、风格、节奏和视觉语法。</p>
    </article>
    <article class="module module-b" data-pptx-kind="shape" data-pptx-id="module-html">
      <h2 data-pptx-kind="text" data-pptx-id="module-html-title">HTML Visual Proof</h2>
      <p data-pptx-kind="text" data-pptx-id="module-html-copy">真实浏览器截图发现溢出、遮挡与错误连线。</p>
    </article>
    <article class="module module-c" data-pptx-kind="shape" data-pptx-id="module-pptx">
      <h2 data-pptx-kind="text" data-pptx-id="module-pptx-title">Native PPTX</h2>
      <p data-pptx-kind="text" data-pptx-id="module-pptx-copy">文本、形状与语义连线保持可编辑。</p>
    </article>
    <svg class="flow-svg" aria-hidden="true">
      <defs>
        <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#15191e"></path>
        </marker>
      </defs>
      <line data-connector data-pptx-kind="line" data-pptx-id="direction-to-html" data-source-id="module-direction" data-target-id="module-html" data-source-anchor="auto" data-target-anchor="auto" data-connector-route="straight" x1="320" y1="340" x2="515" y2="340" stroke="#15191e" stroke-width="3" marker-end="url(#flow-arrow)"></line>
      <line data-connector data-pptx-kind="line" data-pptx-id="html-to-pptx" data-source-id="module-html" data-target-id="module-pptx" data-source-anchor="auto" data-target-anchor="auto" data-connector-route="straight" x1="765" y1="340" x2="960" y2="340" stroke="#15191e" stroke-width="3" marker-end="url(#flow-arrow)"></line>
    </svg>
    <p class="footer" data-pptx-kind="text" data-pptx-id="flow-footer">模块连线必须声明 source、target、anchor、route 与目标箭头。</p>
  </section>
</body>
</html>
