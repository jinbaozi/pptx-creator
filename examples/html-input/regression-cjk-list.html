<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;background:#f3f0e9} .pptx-slide{position:relative;width:1280px;height:720px;overflow:hidden}
    .card{position:absolute;left:96px;top:96px;width:520px;height:520px;padding:28px;box-sizing:border-box;background:#fff;border:2px solid #d67052}
    p,li{font:400 22px/1.45 Arial;color:#1b2a4a} ul{margin:18px 0 0;padding-left:30px} li{height:auto;margin:0 0 .45em}
  </style>
</head>
<body><section class="pptx-slide" data-title="CJK list regression">
  <div class="card" data-pptx-kind="shape" data-pptx-id="cjk-card" data-layout-role="card"></div>
  <div class="card" style="background:transparent;border:0">
    <p data-pptx-kind="text" data-pptx-id="cjk-body" data-semantic-parent-id="cjk-card">这是用于验证真实文本高度的中文正文。<br>第二行保持自然换行。<br>第三行不应穿过卡片边界。<br>第四行继续验证内边距。<br>第五行必须保留。<br>第六行结束。</p>
    <ul data-pptx-id="cjk-list" data-layout-region="cjk-list-region">
      <li data-pptx-kind="text" data-pptx-id="cjk-li-1" data-semantic-parent-id="cjk-card">第一项包含足够多的文字以形成两行并验证自然高度。</li>
      <li data-pptx-kind="text" data-pptx-id="cjk-li-2" data-semantic-parent-id="cjk-card">第二项同样需要独立测量，不能使用固定高度。</li>
      <li data-pptx-kind="text" data-pptx-id="cjk-li-3" data-semantic-parent-id="cjk-card">第三项位于前一项真实底边之后。</li>
    </ul>
  </div>
</section></body>
</html>
