<!doctype html>
<html><head><meta charset="utf-8"><title>Local Fallback</title><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}
.pptx-slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden}

.effect{position:absolute;left:700px;top:210px;width:120px;height:120px;background:#f97316;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(8px 8px 5px rgba(15,23,42,.35))}
