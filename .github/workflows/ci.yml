name: V2 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text-to-html:
    name: text-to-html independent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/text-to-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/text-to-html/package-lock.json
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-cjk locales
          sudo locale-gen zh_CN.UTF-8
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:browser
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
      - run: npm run test:visual
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
      - run: npm run test:isolation

  html-to-pptx:
    name: html-to-pptx independent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/html-to-pptx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/html-to-pptx/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/html-to-pptx/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-liberation fonts-noto-cjk
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:font-office
      - run: npm run test:rich-objects
      - run: npm run test:rich-browser
      - run: npm run test:svg
      - run: npm run test:browser
      - run: npm run test:visual
      - run: npm run test:isolation

  image-to-pptx:
    name: image-to-pptx independent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/image-to-pptx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/image-to-pptx/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/image-to-pptx/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libreoffice poppler-utils fonts-liberation fonts-noto-cjk
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: IMAGE_TO_PPTX_VISUAL=1 npm test
      - run: npm run test:py
      - run: npm run test:isolation

  image-to-pptx-visual-matrix:
    name: image-to-pptx visual matrix (${{ matrix.category }})
    strategy:
      fail-fast: false
      matrix:
        category:
          - zh-dense
          - en-info
          - mixed-language
          - flowchart
          - table-dashboard
          - photography
          - illustration
          - effects
          - low-resolution
          - portrait-non16x9
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: skills/image-to-pptx
    env:
      IMAGE_TO_PPTX_VISUAL_MATRIX: "1"
      IMAGE_TO_PPTX_MATRIX_CATEGORY: ${{ matrix.category }}
      IMAGE_TO_PPTX_MATRIX_OUTPUT: ${{ github.workspace }}/skills/image-to-pptx/output/visual-matrix/${{ matrix.category }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/image-to-pptx/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/image-to-pptx/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim libreoffice poppler-utils fonts-liberation fonts-noto-cjk
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run test:visual-matrix
      - name: Upload category visual summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-to-pptx-visual-matrix-${{ matrix.category }}
          path: skills/image-to-pptx/output/visual-matrix/${{ matrix.category }}/summaries/${{ matrix.category }}.json
          if-no-files-found: warn

  integration:
    name: root integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node integration/scripts/check-v2-repository-governance.mjs
      - run: npm run test:integration

  packages:
    name: package and verify Skills
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run package:skills
      - run: npm run verify:skills

  composition:
    name: full Skill composition
    needs: [text-to-html, html-to-pptx, image-to-pptx, integration, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/text-to-html/package-lock.json
            skills/html-to-pptx/package-lock.json
            skills/image-to-pptx/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            skills/html-to-pptx/requirements.txt
            skills/image-to-pptx/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libreoffice poppler-utils fonts-liberation fonts-noto-cjk
      - run: npm ci
      - run: npm ci --prefix skills/text-to-html
      - run: npm ci --prefix skills/html-to-pptx
      - run: npm ci --prefix skills/image-to-pptx
      - run: python -m pip install -r skills/html-to-pptx/requirements.txt
      - run: python -m pip install -r skills/image-to-pptx/requirements.txt
      - run: npx --prefix skills/html-to-pptx playwright install --with-deps chromium
      - run: npm run test:composition
