<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">知识库试点结构示意图</title>
  <desc id="desc">三个共享目录经过范围筛选、版本治理和责任绑定进入统一知识库。</desc>
  <rect width="1200" height="640" rx="32" fill="#f7f9ff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="76" font-size="30" font-weight="700" fill="#172033">从分散文件到唯一批准版本</text>
    <g transform="translate(70 150)">
      <rect width="250" height="100" rx="20" fill="#ffffff" stroke="#cdd6ef" stroke-width="3"/>
      <text x="125" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="#44506a">共享目录 A</text>
      <rect y="125" width="250" height="100" rx="20" fill="#ffffff" stroke="#cdd6ef" stroke-width="3"/>
      <text x="125" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#44506a">共享目录 B</text>
      <rect y="250" width="250" height="100" rx="20" fill="#ffffff" stroke="#cdd6ef" stroke-width="3"/>
      <text x="125" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#44506a">共享目录 C</text>
    </g>
    <g transform="translate(465 205)">
      <rect width="270" height="245" rx="28" fill="#e8eeff" stroke="#2457e6" stroke-width="4"/>
      <text x="135" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="#173684">试点治理</text>
      <text x="135" y="116" text-anchor="middle" font-size="21" fill="#44506a">范围筛选</text>
      <text x="135" y="158" text-anchor="middle" font-size="21" fill="#44506a">版本清理</text>
      <text x="135" y="200" text-anchor="middle" font-size="21" fill="#44506a">责任绑定</text>
    </g>
    <g transform="translate(875 260)">
      <rect width="260" height="135" rx="28" fill="#2457e6"/>
      <text x="130" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">统一知识库</text>
      <text x="130" y="98" text-anchor="middle" font-size="19" fill="#dfe7ff">唯一批准版本</text>
    </g>
    <g fill="none" stroke="#e97831" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M340 325 H440"/>
      <path d="M755 325 H850"/>
    </g>
    <g fill="#e97831">
      <path d="M440 325 l-20 -14 v28 z"/>
      <path d="M850 325 l-20 -14 v28 z"/>
    </g>
  </g>
</svg>
