<body>
  <main class="pptx-deck" data-deck-title="复杂 HTML 转换验证" data-language="zh-CN">
    <section class="pptx-slide" data-slide-id="slide-001" data-title="三段流程形成可验证闭环" data-notes="强调连接线必须锚定节点边界。">
      <h1 data-pptx-id="title-001">三段流程形成可验证闭环</h1>
      <article class="card a" data-pptx-id="node-a" data-layout-role="container">
        <h2 data-pptx-id="node-a-title">1. 浏览器测量</h2>
        <p data-pptx-id="node-a-body">读取计算样式、几何位置、层叠顺序和裁切。</p>
      </article>
      <article class="card b" data-pptx-id="node-b" data-layout-role="container">
        <h2 data-pptx-id="node-b-title">2. 原生重建</h2>
        <p data-pptx-id="node-b-body">优先生成文字、形状、表格、图表和连接线。</p>
      </article>
      <article class="card c" data-pptx-id="node-c" data-layout-role="container">
        <h2 data-pptx-id="node-c-title">3. 回渲验证</h2>
        <p data-pptx-id="node-c-body">重新渲染 PPTX，并与 HTML 基准逐页比较。</p>
      </article>
      <svg class="connector-layer" viewBox="0 0 1280 720" aria-hidden="true">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"></path>
          </marker>
        </defs>
        <line data-pptx-kind="line" data-pptx-id="connector-a-b" data-connector
              data-source-id="node-a" data-target-id="node-b"
              x1="414" y1="261" x2="466" y2="261"
              stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"></line>
        <line data-pptx-kind="line" data-pptx-id="connector-b-c" data-connector
              data-source-id="node-b" data-target-id="node-c"
              x1="816" y1="261" x2="868" y2="261"
              stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"></line>
      </svg>
      <div class="conclusion" data-pptx-id="conclusion-001">确定性转换负责可重复执行，视觉证据负责阻止错误交付。</div>
      <div class="small-fx" data-pptx-id="local-effect-001">局部效果降级示例</div>
    </section>
    <section class="pptx-slide" data-slide-id="slide-002" data-title="图表与表格继续保持主要可编辑" data-notes="图表数据来自示例标记，不代表真实业务数据。">

      <div class="chart"
           data-pptx-kind="chart"
           data-pptx-id="chart-001"
           data-pptx-chart='{"kind":"horizontalBar","data":[{"label":"文字","value":96},{"label":"形状","value":93},{"label":"表格","value":90},{"label":"图表","value":88}],"style":{"palette":["#2563eb","#0ea5e9","#14b8a6","#f59e0b"],"showValues":true}}'></div>

        <table data-pptx-id="table-001">
          <thead><tr><th>对象</th><th>策略</th><th>状态</th></tr></thead>

            <tr><td>文字</td><td>原生文本框</td><td>可编辑</td></tr>
