<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>协议输入示例</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: Arial, sans-serif; }
    .pptx-slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #fff; }
    h1 { position: absolute; left: 72px; top: 64px; width: 1080px; height: 64px; margin: 0; font-size: 42px; }
    p { position: absolute; left: 72px; top: 190px; width: 980px; height: 100px; margin: 0; font-size: 28px; line-height: 1.4; }
  </style>
</head>
<body>
  <section class="pptx-slide" data-slide-id="slide-001" data-title="协议只提供可选互操作，不限制普通 HTML">
    <h1 data-pptx-id="title-001">协议只提供可选互操作，不限制普通 HTML</h1>
    <p data-pptx-id="body-001">版本不兼容会显式失败；直接传入本地 HTML 仍然受支持。</p>
  </section>
</body>
</html>
